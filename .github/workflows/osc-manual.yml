name: Avalon fork CI

# Fork-only exact-ref validation. This file is intentionally not sent upstream.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git branch, tag, or 40-character commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: avalon-osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Mirrors upstream ci.yml's `ci` job on any target ref.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v7
        with:
          repository: Nitjsefnie-OSC/avalon-protocol
          ref: ${{ inputs.target_ref }}
          # The OpenAPI version check compares against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Report checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
            exit 1
          fi
          printf 'checked-out SHA: %s\n' "$checked_out_sha"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev jq

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # fmt, clippy, tests, OpenAPI freshness and version bump, trust-anchor table.
      - name: Checks
        run: make check

  # Mirrors upstream ci.yml's load-smoke job on any target ref.
  load-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avalon
          POSTGRES_PASSWORD: avalon
          POSTGRES_DB: avalon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avalon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v7
        with:
          repository: Nitjsefnie-OSC/avalon-protocol
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Write env file
        run: |
          cat > "$RUNNER_TEMP/load.env" <<'ENV'
          DATABASE_URL=postgres://avalon:avalon@127.0.0.1:5432/avalon
          AVALON_SERVER_ADDR=127.0.0.1:8080
          AVALON_NETWORK_ID=avalon-dev-local
          AVALON_WEBAUTHN_RP_ID=localhost
          AVALON_WEBAUTHN_ORIGIN=http://localhost:5173
          AVALON_HUB_ORIGIN=http://localhost:5173
          ENV

      - name: Load harness (smoke scale)
        env:
          AVALON_ENV_FILE: ${{ runner.temp }}/load.env
          LOAD_SCALE: smoke
        run: >-
          scripts/load-tests.sh flood-public flood-auth-principal flood-auth-ip many-identities
          announce-source announce-cap announce-strict mesh concurrency db-pool-large
          slow-conn oversized sustained

  # Mirrors upstream ci.yml's witness-drill-smoke job on any target ref.
  witness-drill-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avalon
          POSTGRES_PASSWORD: avalon
          POSTGRES_DB: avalon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avalon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v7
        with:
          repository: Nitjsefnie-OSC/avalon-protocol
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev jq

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Write env file
        run: |
          cat > "$RUNNER_TEMP/drill.env" <<'ENV'
          DATABASE_URL=postgres://avalon:avalon@127.0.0.1:5432/avalon
          AVALON_SERVER_ADDR=127.0.0.1:8080
          AVALON_NETWORK_ID=avalon-dev-local
          AVALON_WEBAUTHN_RP_ID=localhost
          AVALON_WEBAUTHN_ORIGIN=http://localhost:5173
          AVALON_HUB_ORIGIN=http://localhost:5173
          ENV

      - name: Build server
        run: cargo build -p avalon-server --bins --examples

      - name: Witness drill (CI subset)
        env:
          AVALON_ENV_FILE: ${{ runner.temp }}/drill.env
          DRILL_ECLIPSE_FLOOD: "4"
        run: scripts/witness-drill.sh lifecycle eclipse

  # Mirrors upstream ci.yml's nat-scenarios-smoke job on any target ref.
  nat-scenarios-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avalon
          POSTGRES_PASSWORD: avalon
          POSTGRES_DB: avalon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avalon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v7
        with:
          repository: Nitjsefnie-OSC/avalon-protocol
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Install build and lab dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev jq nftables xxd iproute2

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Write env file
        run: |
          cat > "$RUNNER_TEMP/nat.env" <<'ENV'
          DATABASE_URL=postgres://avalon:avalon@127.0.0.1:5432/avalon
          AVALON_SERVER_ADDR=127.0.0.1:8080
          AVALON_NETWORK_ID=avalon-dev-local
          AVALON_WEBAUTHN_RP_ID=localhost
          AVALON_WEBAUTHN_ORIGIN=http://localhost:5173
          AVALON_HUB_ORIGIN=http://localhost:5173
          ENV

      - name: Build server
        run: cargo build -p avalon-server --bins --examples

      - name: NAT scenarios (CI subset)
        env:
          AVALON_ENV_FILE: ${{ runner.temp }}/nat.env
        run: sudo -E env "PATH=$PATH" scripts/nat-scenarios.sh public relayed-symmetric punch-port-restricted url-less-credential url-less-shard-author
